name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --noconfirm --clean --windowed --name ResearchFileManager --add-data "templates;templates" app.py
      - run: Compress-Archive -Path dist\ResearchFileManager -DestinationPath ResearchFileManager-Windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: ResearchFileManager-Windows
          path: ResearchFileManager-Windows.zip
