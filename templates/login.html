<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research File Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#f4f7fb;color:#172033}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border:1px solid #e3e8f0;border-radius:18px;box-shadow:0 12px 35px #12233d12;width:min(420px,100%);padding:34px}
.brand{font-weight:800;font-size:24px;color:#0b1f3a;margin-bottom:8px}.muted{color:#718096;font-size:14px}
label{display:block;margin:18px 0 7px;font-size:13px;font-weight:700}
input{width:100%;padding:12px 13px;border:1px solid #d7deea;border-radius:10px;outline:none;font-size:14px}
input:focus{border-color:#3267b1}
button{border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer;background:#0b1f3a;color:#fff;width:100%;margin-top:22px}
.err{margin-top:14px;color:#b42318;font-size:13px}
</style></head><body>
<div class="login"><div class="card">
<div class="brand">Research File Manager</div>
<div class="muted">Multi-user research document manager &middot; files stored on this PC</div>
<label>Username</label><input id="username" autocomplete="username" autofocus>
<label>Password</label><input id="password" type="password" autocomplete="current-password">
<button onclick="login()">Sign in</button>
<div id="err" class="err"></div>
</div></div>
<script>
async function login(){
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({username:username.value,password:password.value})});
 const d=await r.json();
 if(r.ok) location.href='/'; else err.textContent=d.error||'Login failed';
}
password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});
username.addEventListener('keydown',e=>{if(e.key==='Enter')password.focus()});
</script></body></html>
